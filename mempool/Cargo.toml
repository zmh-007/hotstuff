[package]
name = "mempool"
version = "0.1.0"
authors = ["Alberto Sonnino <asonnino@fb.com>"]
edition = "2018"

[dependencies]
placeholder_project_name_placeholder_zk = { path = "../../monorepo/zk/plonky2" }
l0 = { path = "../../monorepo/l0" }
tokio = { version = "1.5.0", features = ["sync", "rt", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.61"
bytes = "1.0.1"
log = "0.4.14"
bincode = "1.3.3"
futures = "0.3.14"
async-trait = "0.1.50"

crypto = { path = "../crypto" }
store = { path = "../store" }
network = { path = "../network" }

[dev-dependencies]
tokio-util = { version = "0.7.3", features= ["codec"] }
rand = "0.7.3"

[features]
benchmark = []
